# ============================================================
# VERO — nginx_vero.conf   (para MERGE no default.conf do CONTAINER)
# Reproduz as regras do .htaccess (Apache, dev) para PRODUÇÃO nginx.
#
# CONTEXTO REAL do container `web`:
#   server_name _;   root /var/www/html;   fastcgi_pass php:9000;
#   fonte: ~/vero_setup/nginx/default.conf -> /srv/vero/nginx/default.conf (montada)
#   RELOAD = docker compose restart web   (nginx do container só relê ao reiniciar)
#   Há um proxy TLS de borda na frente: o container recebe HTTP; o esquema real
#   vem em X-Forwarded-Proto. HSTS/preload é emitido pela borda.
#
# ============================================================
# 🚨 LIÇÃO DO INCIDENTE 27/07 — NUNCA repetir (vazamento de código-fonte):
#   `try_files $uri $uri.php $uri/ /index.php;`  está ERRADO.
#   Os argumentos do MEIO do try_files são servidos como ARQUIVO ESTÁTICO:
#   `$uri.php` faz o nginx ENTREGAR dashboard.php como DOWNLOAD
#   (application/octet-stream) e VAZAR o fonte, em vez de executá-lo.
#   Só o ÚLTIMO argumento do try_files faz redirect interno (cai no fastcgi).
#   => JAMAIS use `$uri.php` como argumento não-final de try_files.
#   O padrão correto (executa, não baixa) está no location / + @extensionless
#   abaixo. Validação: cheque Content-Type=text/html e corpo SEM `<?php`
#   (status 200 NÃO prova sucesso — o Content-Type prova).
# ============================================================
# MERGE, não substituir: preserve o que já existe no default.conf (roteamento
# /api/v1/*, deny de PHP em /uploads|/storage, os ^~ de pastas sensíveis, etc.).
# Faça diff contra a config atual antes de aplicar.
# ============================================================

# HTTPS atrás do proxy TLS de borda: deriva o esquema do X-Forwarded-Proto.
# ⚠️ `map` é de nível http{}. Como o default.conf é incluído dentro de http{}
# (conf.d/*.conf), pode ficar aqui no topo do arquivo. Se seu include for em
# outro escopo, mova este map para o http{} principal.
map $http_x_forwarded_proto $fcgi_https {
    default "";
    https   "on";
}

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 10m;
    autoindex off;
    server_tokens off;

    # Atrás do proxy TLS: emite redirects relativos (sem http:// vazando o esquema).
    absolute_redirect off;

    # --- Cabeçalhos de segurança (server-level; reforçados no location de PHP) ---
    add_header X-Frame-Options            "SAMEORIGIN"                        always;
    add_header X-Content-Type-Options     "nosniff"                           always;
    add_header X-XSS-Protection           "1; mode=block"                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"   always;
    # HSTS é emitido pela borda TLS — não duplicar aqui.

    # --- Páginas de erro branded (raiz, SEM /vero/) ---
    error_page 403 /403.php;
    error_page 404 /404.php;
    error_page 500 502 503 504 /500.php;
    location = /403.php { internal; include fastcgi_params; fastcgi_pass php:9000; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param HTTPS $fcgi_https; }
    location = /404.php { internal; include fastcgi_params; fastcgi_pass php:9000; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param HTTPS $fcgi_https; }
    location = /500.php { internal; include fastcgi_params; fastcgi_pass php:9000; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param HTTPS $fcgi_https; }

    # --- Dotfiles (.git, .env, .htaccess) — vem primeiro ---
    location ~ /\. { deny all; return 403; }

    # --- Diretórios sensíveis (^~ ganha do regex de PHP; nem executa lá dentro) ---
    # Inclui utilitários de DEV/CLI/CI (scripts, deploy, tools, tests) que NÃO
    # podem ser roteáveis pela web.
    location ^~ /includes/        { deny all; return 403; }
    location ^~ /config/          { deny all; return 403; }
    location ^~ /database/        { deny all; return 403; }
    location ^~ /migrations/      { deny all; return 403; }
    location ^~ /storage_private/ { deny all; return 403; }
    location ^~ /api/src/         { deny all; return 403; }
    location ^~ /node_modules/    { deny all; return 403; }
    location ^~ /scripts/         { deny all; return 403; }
    location ^~ /deploy/          { deny all; return 403; }
    location ^~ /tools/           { deny all; return 403; }
    location ^~ /tests/           { deny all; return 403; }

    # --- PHP NUNCA executa dentro de uploads/storage (defesa vs upload->RCE) ---
    location ~* ^/(uploads|storage)/.*\.php$ { deny all; return 403; }

    # --- Extensões sensíveis em qualquer diretório -> 403 branded ---
    location ~* \.(env|sql|log|sh|bak|swp|git|md|json|lock|ya?ml|ini|cfg|conf|dist|htpasswd|pem|key|crt|pfx|p12|jks)$ {
        deny all;
        return 403;
    }

    # --- Utilitários administrativos restritos (regex ANTES do ~ \.php$ genérico) ---
    location ~* (^|/)(criar_admin|phpinfo|debug|setup|install|migrate)\.php$ {
        allow 127.0.0.1;
        allow ::1;
        # allow 172.16.0.0/12;   # AJUSTAR: sub-rede interna do Docker, se aplicável
        deny all;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fcgi_https;
    }

    # --- URL amigável da cápsula da Universidade ---
    rewrite ^/universidade/capsula/([a-z0-9-]+)/?$ /universidade/capsula.php?slug=$1 last;

    # ============================================================
    # URLs LIMPAS que EXECUTAM o .php (SEM vazar fonte)
    # location / só serve ARQUIVOS ESTÁTICOS reais; o resto vai para @extensionless.
    # ============================================================
    location / {
        try_files $uri @extensionless;
    }
    location @extensionless {
        # Se existe <caminho>.php, EXECUTA (rewrite last -> reavalia -> location ~ \.php$).
        # O `if (-f ...)` + `rewrite last` é um dos usos SEGUROS de if no nginx.
        # Isto faz o .php de mesmo nome GANHAR do diretório (dashboard.php x dashboard/)
        # e ser EXECUTADO, não baixado.
        if (-f $document_root$uri.php) {
            rewrite ^ $uri.php last;
        }
        # Senão: diretório real (index) e, por fim, o front-controller (router).
        try_files $uri/ /index.php?$query_string;
    }

    # ============================================================
    # PHP-FPM + 301 canônico (*.php GET -> URL limpa) + anti PATH_INFO
    # ============================================================
    location ~ \.php$ {
        # Anti PATH_INFO: só executa .php que existe de fato (evita /x.php/foo).
        try_files $uri =404;

        # 301 canônico decidido pelo $request_uri (pedido ORIGINAL), NÃO pelo $uri
        # (que o rewrite interno da cápsula/@extensionless altera) -> SEM loop.
        set $canon "";
        if ($request_method ~ ^(GET|HEAD)$)        { set $canon "G"; }
        if ($request_uri ~ "^([^?]*)\.php($|\?)")  { set $canon "${canon}P"; }
        if ($canon = "GP") { return 301 $1$is_args$args; }

        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
        fastcgi_param HTTPS           $fcgi_https;     # cookie Secure/scheme atrás do proxy TLS

        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }
}
