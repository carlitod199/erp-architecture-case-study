; VERO — pool php-fpm de produção: SOCKET UNIX + user 10001 + logs no stderr.
[www]
user = vero-php
group = vero-php

; Contrato: nginx fala por socket unix, NÃO há TCP 9000.
listen = /run/php/vero.sock
; owner/group do socket = usuário do nginx (AJUSTE ao seu container nginx).
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Contrato: request_terminate_timeout 120s (max_execution_time do PHP é 110s).
request_terminate_timeout = 120s

; Logs do worker -> stderr do container (coleta da Fase 6).
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on

; Garante o BIOS_LOG_STDERR no worker (o bootstrap.php manda o error_log p/ stderr).
env[BIOS_LOG_STDERR] = 1
env[APP_ENV] = production
