; VERO — PHP de produção (conf.d). O HARDENING (3 travas) é contrato da infra;
; deixei os valores aqui para a imagem ser testável — ajuste se divergir da sua stack.

; --- limites / runtime (contrato) ---
memory_limit = 128M
max_execution_time = 110
upload_max_filesize = 32M
post_max_size = 40M
expose_php = Off
display_errors = Off
log_errors = On
; timezone da app (o código também força -03:00 por sessão no MySQL)
date.timezone = America/Sao_Paulo

; --- opcache: código dentro da imagem, nunca relido do disco ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 30000
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

; --- HARDENING (contrato da infra) ---
allow_url_fopen = Off
; /etc/ssl/certs entra porque BIOS_CURL_CAINFO aponta para lá (entrypoint.sh);
; fora do basedir, o is_file() do CA vira warning→ErrorException e o clima morre.
open_basedir = /var/www/vero:/tmp:/etc/ssl/certs
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl

; --- Sessão no Redis database 1 ---
; O save_path COM a senha (auth=...) é injetado pelo entrypoint em runtime
; (não pode ser baked na imagem). Aqui fica só o handler.
session.save_handler = redis
; (cookie httponly/samesite/secure são setados pelo próprio código em runtime)
