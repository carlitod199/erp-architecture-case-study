<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08262A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VERO Campo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="../assets/vendor/fonts/vero-fonts.css">
<style>
/* ===== VERO Campo — PWA protótipo (A4-12). Mobile-first, alto contraste
   (uso ao sol), botões grandes (≥56px), 1 decisão por tela, ícone+texto
   curto (baixa alfabetização). Dados são MOCK — A1 integra depois. ===== */
:root{
  --bg:#F0EBE0; --card:#FFFFFF; --ink:#182A20; --ink2:#4A5A50; --mut:#8A9188;
  --teal:#005059; --teald:#08262A; --line:#E2DAC9;
  --green:#2E8B3D; --greend:#216B2C; --lime:#7CB342;
  --amber:#C77800; --amberbg:#FBEFD8; --danger:#C0392B; --dangerbg:#FBE4E0;
  --r:16px; --tap:58px;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:'Hanken Grotesk',var(--sans);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--teald);color:var(--ink);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ===== TOPO ===== */
.top{background:var(--teald);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;gap:12px;flex:none}
.top__logo{height:26px;width:auto;display:block}
.top__farm{font:600 14px/1 var(--sans);letter-spacing:.01em}
.top__farm small{display:block;font-weight:400;font-size:11px;color:#9FB6AE;margin-top:3px}
.top__sync{margin-left:auto;font-size:11px;color:#9FB6AE;display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(124,179,66,.25)}

/* ===== VIEWS ===== */
.view{flex:1;display:none;flex-direction:column;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto}
.view.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== HOME (pequeno produtor) ===== */
.hi{font:700 22px/1.2 var(--disp);color:var(--ink);margin:4px 0 2px}
.hi small{display:block;font:400 13px/1.3 var(--sans);color:var(--ink2);margin-top:5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:20px 16px;display:flex;flex-direction:column;gap:12px;min-height:132px;
  text-align:left;box-shadow:0 2px 0 rgba(24,42,32,.04);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile__ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff}
.tile__ic svg{width:28px;height:28px}
.tile__t{font:700 16px/1.15 var(--sans);color:var(--ink)}
.tile__s{font:400 12px/1.2 var(--sans);color:var(--mut);margin-top:-6px}
.tile--mon .tile__ic{background:var(--green)}
.tile--est .tile__ic{background:var(--teal)}
.tile--apo .tile__ic{background:var(--amber)}
.tile--ale .tile__ic{background:var(--danger)}
.tile__badge{position:absolute;top:12px;right:12px;background:var(--danger);color:#fff;
  font:700 12px var(--sans);min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.tile{position:relative}

/* ===== FLUXO DO MONITOR ===== */
.flow-top{display:flex;align-items:center;gap:12px;flex:none;padding:12px 16px 6px;background:var(--bg)}
.back{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px;color:var(--ink)}
.steps{display:flex;gap:7px;flex:1}
.steps i{height:6px;border-radius:3px;background:var(--line);flex:1;transition:background .2s}
.steps i.done{background:var(--green)}
.q{font:700 24px/1.2 var(--disp);color:var(--ink);margin:6px 0 3px}
.q small{display:block;font:400 13px var(--sans);color:var(--ink2);margin-top:6px}

/* opções grandes (talhão / alvo) */
.opts{display:grid;gap:12px;margin-top:20px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;
  min-height:var(--tap);padding:14px 16px;display:flex;align-items:center;gap:14px;
  font:600 17px var(--sans);color:var(--ink);text-align:left;transition:.12s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--green);background:#F1F8EE;box-shadow:0 0 0 3px rgba(46,139,61,.12)}
.opt__ic{width:40px;height:40px;border-radius:11px;background:#F0EBE0;display:grid;place-items:center;flex:none;font-size:22px}
.opt__ic svg{width:24px;height:24px;color:var(--teal)}
.opt small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px}
.opt .chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.sel .chk{background:var(--green);border-color:var(--green)}
.opt.sel .chk svg{width:16px;height:16px;color:#fff}
.opt .chk svg{display:none} .opt.sel .chk svg{display:block}

/* contador de quantidade */
.count{margin:26px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}
.count__n{font:700 64px/1 var(--disp);color:var(--teal);font-variant-numeric:tabular-nums}
.count__u{font:500 14px var(--sans);color:var(--mut);margin-top:6px}
.count__row{display:flex;gap:16px;justify-content:center;margin-top:20px}
.pm{width:76px;height:76px;border-radius:50%;background:var(--teal);color:#fff;font-size:40px;
  display:grid;place-items:center;box-shadow:0 6px 0 var(--teald)}
.pm:active{transform:translateY(3px);box-shadow:0 3px 0 var(--teald)}
.pm.minus{background:#fff;color:var(--teal);border:2px solid var(--teal);box-shadow:0 6px 0 var(--line)}
.quick{display:flex;gap:10px;margin-top:18px}
.quick button{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font:600 15px var(--sans);color:var(--ink2)}
.quick button.on{border-color:var(--amber);background:var(--amberbg);color:var(--amber)}

/* foto */
.photo{margin-top:22px}
.cam{width:100%;min-height:200px;border:2px dashed var(--line);border-radius:20px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink2)}
.cam svg{width:60px;height:60px;color:var(--teal)}
.cam b{font:700 17px var(--sans)}
.cam span{font-size:12.5px;color:var(--mut)}
.cam img{width:100%;height:100%;max-height:280px;object-fit:cover;border-radius:18px;display:block}
.photo input{display:none}

/* resumo + enviar */
.rec{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:16px;overflow:hidden}
.rec__row{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}
.rec__row:last-child{border-bottom:0}
.rec__ic{width:36px;height:36px;border-radius:10px;background:#F0EBE0;display:grid;place-items:center;flex:none}
.rec__ic svg{width:20px;height:20px;color:var(--teal)}
.rec__l{font-size:12px;color:var(--mut)} .rec__v{font:600 16px var(--sans);color:var(--ink);margin-top:1px}
.alertbox{margin-top:16px;background:var(--dangerbg);border:1px solid #E9B8B0;border-radius:14px;
  padding:14px 16px;display:flex;gap:12px;align-items:flex-start;color:#8A2B20;font-size:13.5px;line-height:1.4}
.alertbox svg{width:24px;height:24px;flex:none;color:var(--danger)}

/* barra de ação fixa embaixo */
.bar{flex:none;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(0deg,var(--bg) 70%,transparent)}
.cta{width:100%;min-height:62px;border-radius:16px;background:var(--green);color:#fff;
  font:700 19px var(--sans);display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 5px 0 var(--greend)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--greend)}
.cta:disabled{background:#C9C0AE;box-shadow:0 5px 0 #B3AA98;color:#F0EBE0}
.cta svg{width:24px;height:24px}
.cta--send{background:var(--danger);box-shadow:0 5px 0 #8A2B20}
.cta--send:active{box-shadow:0 2px 0 #8A2B20}

/* sucesso */
.ok{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:6px}
.ok__c{width:120px;height:120px;border-radius:50%;background:var(--green);display:grid;place-items:center;
  box-shadow:0 0 0 12px rgba(46,139,61,.15);animation:pop .4s cubic-bezier(.22,1.2,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ok__c svg{width:64px;height:64px;color:#fff}
.ok h2{font:700 24px var(--disp);margin:20px 0 0}
.ok p{color:var(--ink2);font-size:14.5px;margin:8px 0 0;max-width:280px}
.ghost{margin-top:26px;min-height:52px;padding:0 26px;border-radius:14px;border:2px solid var(--teal);color:var(--teal);font:700 16px var(--sans);background:#fff}

.badgebar{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:5px 12px;font-size:12px;color:var(--ink2);margin-top:14px}
.badgebar .dot{width:7px;height:7px}
</style>
</head>
<body>
<div class="app">
  <!-- TOPO -->
  <header class="top">
    <img class="top__logo" src="../assets/img/logo_vero.png" alt="VERO">
    <div class="top__farm">Fazenda Boa Vista<small id="topSub">Zé do Campo · Monitor</small></div>
    <div class="top__sync"><span class="dot"></span><span id="syncTxt">no aparelho</span></div>
  </header>

  <!-- HOME -->
  <main class="view on" id="vHome">
    <div class="hi">Bom dia, Zé!<small>O que você vai fazer agora?</small></div>
    <div class="tiles">
      <button class="tile tile--mon" onclick="startMonitor()">
        <span class="tile__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
        <span class="tile__t">Monitorar</span><span class="tile__s">olhar a lavoura</span>
      </button>
      <button class="tile tile--est" onclick="toast('Protótipo: Estoque')">
        <span class="tile__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span>
        <span class="tile__t">Estoque</span><span class="tile__s">ver produtos</span>
      </button>
      <button class="tile tile--apo" onclick="toast('Protótipo: Apontamento simples')">
        <span class="tile__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
        <span class="tile__t">Apontar</span><span class="tile__s">registrar serviço</span>
      </button>
      <button class="tile tile--ale" onclick="toast('Protótipo: 3 alertas')">
        <span class="tile__badge">3</span>
        <span class="tile__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
        <span class="tile__t">Alertas</span><span class="tile__s">3 para ver</span>
      </button>
    </div>
    <div class="badgebar"><span class="dot"></span>Funciona sem internet · envia quando conectar</div>
  </main>

  <!-- MONITOR: fluxo em 5 passos -->
  <main class="view" id="vMon">
    <div class="flow-top">
      <button class="back" onclick="monBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="steps" id="steps"></div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:6px 16px 12px" id="monBody"></div>
    <div class="bar"><button class="cta" id="monCta" onclick="monNext()">Continuar</button></div>
  </main>

  <!-- SUCESSO -->
  <main class="view" id="vOk">
    <div class="ok">
      <div class="ok__c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h2>Enviado ao líder!</h2>
      <p id="okMsg">O líder recebeu seu monitoramento. Se passar do nível, ele já inicia a pulverização.</p>
      <button class="ghost" onclick="go('vHome')">Voltar ao início</button>
    </div>
  </main>
</div>

<script>
/* ===== dados MOCK (A1 integra com mip_alvos / talhões reais) ===== */
var TALHOES = [
  {c:'5A', v:'Uva Itália', ha:'1,2 ha'}, {c:'5B', v:'Uva Itália', ha:'0,9 ha'},
  {c:'6A', v:'Uva Benitaka', ha:'1,5 ha'}, {c:'6B', v:'Uva Benitaka', ha:'1,1 ha'},
  {c:'7A', v:'Manga Palmer', ha:'2,0 ha'}, {c:'7B', v:'Manga Palmer', ha:'1,8 ha'}
];
var ALVOS = [
  {n:'Tripes', t:'praga', e:'🐛', nivel:5}, {n:'Ácaro', t:'praga', e:'🕷️', nivel:8},
  {n:'Mosca-das-frutas', t:'praga', e:'🪰', nivel:3}, {n:'Cochonilha', t:'praga', e:'🐞', nivel:6},
  {n:'Oídio', t:'doença', e:'🍄', nivel:4}, {n:'Míldio', t:'doença', e:'🍂', nivel:4},
  {n:'Antracnose', t:'doença', e:'🟤', nivel:3}
];
var ico={
  local:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  bug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 2 1.5 1.5M16 2l-1.5 1.5"/><path d="M12 20a6 6 0 0 0 6-6v-3a6 6 0 0 0-12 0v3a6 6 0 0 0 6 6Z"/><path d="M12 8v12M3 13h4M17 13h4M4 8l3 1M20 8l-3 1M4 18l3-1M20 18l-3-1"/></svg>',
  count:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7h6M9 12h6M9 17h4"/><rect x="4" y="3" width="16" height="18" rx="2"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>',
  chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>'
};
var S={step:0, talhao:null, alvo:null, qtd:0, quick:null, foto:false};
var TOTAL=5;

function go(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on')});document.getElementById(id).classList.add('on')}
function startMonitor(){S={step:0,talhao:null,alvo:null,qtd:0,quick:null,foto:false};go('vMon');renderStep()}
function monBack(){ if(S.step===0){go('vHome')} else {S.step--;renderStep()} }
function monNext(){ if(S.step<TOTAL-1){S.step++;renderStep()} else {enviar()} }

function renderStep(){
  var steps=document.getElementById('steps');steps.innerHTML='';
  for(var i=0;i<TOTAL;i++){var b=document.createElement('i');if(i<=S.step)b.className='done';steps.appendChild(b)}
  var body=document.getElementById('monBody'), cta=document.getElementById('monCta');
  cta.className='cta'; cta.innerHTML='Continuar';
  if(S.step===0){ // talhão
    body.innerHTML='<div class="q">Onde você está?<small>Escolha o talhão</small></div><div class="opts" id="o"></div>';
    var o=document.getElementById('o');
    TALHOES.forEach(function(t){var el=document.createElement('button');el.className='opt'+(S.talhao===t.c?' sel':'');
      el.innerHTML='<span class="opt__ic">'+ico.local+'</span><span>Talhão '+t.c+'<small>'+t.v+' · '+t.ha+'</small></span><span class="chk">'+ico.chk+'</span>';
      el.onclick=function(){S.talhao=t.c;renderStep()};o.appendChild(el)});
    cta.disabled=!S.talhao;
  } else if(S.step===1){ // alvo
    body.innerHTML='<div class="q">O que você viu?<small>Praga ou doença</small></div><div class="opts" id="o"></div>';
    var o=document.getElementById('o');
    ALVOS.forEach(function(a){var el=document.createElement('button');el.className='opt'+(S.alvo&&S.alvo.n===a.n?' sel':'');
      el.innerHTML='<span class="opt__ic">'+a.e+'</span><span>'+a.n+'<small>'+a.t+' · nível '+a.nivel+'</small></span><span class="chk">'+ico.chk+'</span>';
      el.onclick=function(){S.alvo=a;renderStep()};o.appendChild(el)});
    cta.disabled=!S.alvo;
  } else if(S.step===2){ // quantidade
    body.innerHTML='<div class="q">Quantos você contou?<small>'+(S.alvo?S.alvo.n:'')+' no talhão '+S.talhao+'</small></div>'+
      '<div class="count"><div class="count__n" id="cn">'+S.qtd+'</div><div class="count__u">encontrados na planta</div>'+
      '<div class="count__row"><button class="pm minus" onclick="dq(-1)">−</button><button class="pm" onclick="dq(1)">+</button></div></div>'+
      '<div class="quick" id="q"><button onclick="setq(2,\'Baixo\')">Baixo</button><button onclick="setq(6,\'Médio\')">Médio</button><button onclick="setq(12,\'Alto\')">Alto</button></div>';
    markQuick();
    cta.disabled=S.qtd<=0;
  } else if(S.step===3){ // foto
    body.innerHTML='<div class="q">Tire uma foto<small>Ajuda o líder a decidir (pode pular)</small></div>'+
      '<div class="photo"><label class="cam" id="cam">'+(S.foto?
        '<img src="'+S.foto+'" alt="foto">':
        (ico.cam+'<b>Tocar para fotografar</b><span>a folha ou o fruto atacado</span>'))+
        '<input type="file" accept="image/*" capture="environment" id="file"></label></div>';
    document.getElementById('file').onchange=function(e){var f=e.target.files[0];if(!f)return;
      var r=new FileReader();r.onload=function(){S.foto=r.result;renderStep()};r.readAsDataURL(f)};
    cta.innerHTML= S.foto?'Continuar':'Pular foto';
  } else { // enviar
    var acima = S.alvo && S.qtd >= S.alvo.nivel;
    body.innerHTML='<div class="q">Confirmar e enviar<small>Confira antes de mandar ao líder</small></div>'+
      '<div class="rec">'+
        row(ico.local,'Talhão','Talhão '+S.talhao)+
        row(ico.bug,'Alvo',(S.alvo?S.alvo.n+' ('+S.alvo.t+')':''))+
        row(ico.count,'Quantidade',S.qtd+' encontrados'+(S.quick?' · '+S.quick:''))+
        row(ico.cam,'Foto',S.foto?'1 foto anexada':'sem foto')+
      '</div>'+
      (acima?'<div class="alertbox">'+ico.alert+'<div><b>Acima do nível de ação ('+S.alvo.nivel+').</b> Ao enviar, o líder recebe um alerta para iniciar a pulverização.</div></div>':'');
    cta.className='cta cta--send'; cta.disabled=false;
    cta.innerHTML=ico.chk+'ENVIAR PARA O LÍDER';
  }
}
function row(ic,l,v){return '<div class="rec__row"><span class="rec__ic">'+ic+'</span><div><div class="rec__l">'+l+'</div><div class="rec__v">'+v+'</div></div></div>'}
function dq(n){S.qtd=Math.max(0,S.qtd+n);S.quick=null;document.getElementById('cn').textContent=S.qtd;markQuick();document.getElementById('monCta').disabled=S.qtd<=0}
function setq(v,label){S.qtd=v;S.quick=label;document.getElementById('cn').textContent=v;markQuick();document.getElementById('monCta').disabled=false}
function markQuick(){var q=document.getElementById('q');if(!q)return;var m={'Baixo':0,'Médio':1,'Alto':2};
  [].forEach.call(q.children,function(b,i){b.classList.toggle('on',m[S.quick]===i)})}

function enviar(){
  document.getElementById('syncTxt').textContent='enviando…';
  var acima = S.alvo && S.qtd >= S.alvo.nivel;
  document.getElementById('okMsg').innerHTML = acima
    ? '<b>Alerta enviado.</b> O líder já pode iniciar a pulverização de <b>'+S.alvo.n+'</b> no talhão '+S.talhao+'.'
    : 'O líder recebeu seu monitoramento de '+S.alvo.n+' no talhão '+S.talhao+'. Abaixo do nível — sem ação por enquanto.';
  go('vOk');
  setTimeout(function(){document.getElementById('syncTxt').textContent='no aparelho'},1600);
}

function toast(t){
  var d=document.createElement('div');d.textContent=t;
  d.style.cssText='position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#182A20;color:#fff;padding:12px 20px;border-radius:24px;font:600 14px sans-serif;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)';
  document.body.appendChild(d);setTimeout(function(){d.remove()},1600);
}

/* PWA: registra o service worker (offline shell) */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
